plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hoanlac.app'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.hoanlac.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Không nén file trong assets để WebView đọc nhanh
    androidResources {
        noCompress += ['html', 'js']
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'org.slf4j:slf4j-nop:2.0.13'
}
