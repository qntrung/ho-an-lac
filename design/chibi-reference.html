<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chibi mịn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6E9D8; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #tag {
    position: fixed; top: 12px; left: 12px; max-width: min(340px, calc(100vw - 24px));
    padding: 10px 14px 11px; border-radius: 16px;
    background: rgba(255, 252, 246, 0.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(90, 70, 50, 0.12);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #4A3F3A;
    pointer-events: none; user-select: none;
  }
  #tag b { display: block; font-size: 17px; letter-spacing: .2px; color: #3E5664; }
  #tag span { display: block; font-size: 13px; line-height: 1.4; margin-top: 3px; }
  #tag i { display: block; font-style: normal; font-size: 11px; margin-top: 5px; color: #8A7B70; }
</style>
</head>
<body>
<div id="tag">
  <b>Chibi mịn</b>
  <span>Nhân vật đầu to, bề mặt bo tròn mượt, màu pastel và ánh sáng ấm dịu.</span>
  <i>Kéo để xoay · chụm hoặc cuộn để phóng to</i>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
var T = THREE;
var Q = new URLSearchParams(location.search);
var T0 = parseFloat(Q.get('t') || '0'), FREEZE = Q.has('freeze'), FOCUS = Q.has('focus');

/* ---------- helpers ---------- */
function lin(hex) { return new T.Color(hex).convertSRGBToLinear(); }
function mixC(a, b, k) { return a.clone().lerp(b, k); }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function sstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function seg(t, a, b) { return sstep(a, b, t); }
function lerp(a, b, k) { return a + (b - a) * k; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(7);
var V2 = function (x, y) { return new T.Vector2(x, y); };

var _dummy = new T.Object3D();
function MX(pos, rot, scl) {
  _dummy.position.set(pos ? pos[0] : 0, pos ? pos[1] : 0, pos ? pos[2] : 0);
  _dummy.rotation.set(rot ? rot[0] : 0, rot ? rot[1] : 0, rot ? rot[2] : 0);
  if (scl === undefined) _dummy.scale.set(1, 1, 1);
  else if (typeof scl === 'number') _dummy.scale.set(scl, scl, scl);
  else _dummy.scale.set(scl[0], scl[1], scl[2]);
  _dummy.updateMatrix(); return _dummy.matrix.clone();
}
// orient +z along outward direction dir (unit), placed at pos
function MXlook(pos, dir, scl, spin) {
  _dummy.position.copy(pos); _dummy.rotation.set(0, 0, 0);
  _dummy.lookAt(pos.clone().add(dir));
  if (spin) _dummy.rotateZ(spin);
  if (scl === undefined) _dummy.scale.set(1, 1, 1); else if (typeof scl === 'number') _dummy.scale.set(scl, scl, scl); else _dummy.scale.set(scl[0], scl[1], scl[2]);
  _dummy.updateMatrix(); return _dummy.matrix.clone();
}

/* Parts: collects geometries with baked vertex colors, then merges them into one draw call */
function Parts() { this.g = []; }
Parts.prototype.add = function (geo, col, m) {
  var g = geo.index ? geo.toNonIndexed() : geo.clone();
  var pl = g.attributes.position.array.slice(0);
  if (m) g.applyMatrix4(m);
  var p = g.attributes.position.array, n = g.attributes.normal.array, cnt = p.length / 3;
  var c = new Float32Array(cnt * 3), fixed = (col instanceof T.Color) ? col : null;
  var vl = new T.Vector3(), vw = new T.Vector3(), nw = new T.Vector3();
  for (var i = 0; i < cnt; i++) {
    var cc = fixed;
    if (!cc) { vl.set(pl[i * 3], pl[i * 3 + 1], pl[i * 3 + 2]); vw.set(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]); nw.set(n[i * 3], n[i * 3 + 1], n[i * 3 + 2]); cc = col(vl, vw, nw); }
    c[i * 3] = cc.r; c[i * 3 + 1] = cc.g; c[i * 3 + 2] = cc.b;
  }
  this.g.push({ p: p, n: n, c: c });
  return this;
};
Parts.prototype.geometry = function () {
  var tot = 0; this.g.forEach(function (x) { tot += x.p.length; });
  var P = new Float32Array(tot), N = new Float32Array(tot), C = new Float32Array(tot), o = 0;
  this.g.forEach(function (x) { P.set(x.p, o); N.set(x.n, o); C.set(x.c, o); o += x.p.length; });
  var g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('color', new T.BufferAttribute(C, 3));
  g.computeBoundingSphere();
  return g;
};
Parts.prototype.mesh = function (mat, cast, recv) {
  var m = new T.Mesh(this.geometry(), mat); m.castShadow = !!cast; m.receiveShadow = recv !== false; return m;
};

function lathe(pts, segs) { return new T.LatheGeometry(pts.map(function (a) { return V2(a[0], a[1]); }), segs || 32); }
// smooth capsule centred on origin along y
function capsule(r, len, segs, rings) {
  rings = rings || 8; var pts = [], i, a;
  for (i = 0; i <= rings; i++) { a = -Math.PI / 2 + (i / rings) * Math.PI / 2; pts.push([Math.max(1e-4, Math.cos(a) * r), -len / 2 + Math.sin(a) * r]); }
  for (i = 0; i <= rings; i++) { a = (i / rings) * Math.PI / 2; pts.push([Math.max(1e-4, Math.cos(a) * r), len / 2 + Math.sin(a) * r]); }
  return lathe(pts, segs || 20);
}
// radial folds on a lathe (robe pleats, bark ridges)
function folds(geo, n, ampFn) {
  var p = geo.attributes.position;
  for (var i = 0; i < p.count; i++) {
    var x = p.getX(i), y = p.getY(i), z = p.getZ(i), a = Math.atan2(x, z), k = 1 + ampFn(y) * Math.sin(a * n);
    p.setXYZ(i, x * k, y, z * k);
  }
  geo.computeVertexNormals(); return geo;
}
function rockGeo(seed, w, h, amp) {
  amp = amp === undefined ? 1 : amp;
  var g = new T.SphereGeometry(1, w || 14, h || 10), p = g.attributes.position, r = rng(seed);
  var f1 = 1.5 + r() * 2, f2 = 2 + r() * 3, o1 = r() * 9, o2 = r() * 9;
  for (var i = 0; i < p.count; i++) {
    var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    var d = 1 + amp * 0.09 * Math.sin(x * f1 + o1) * Math.sin(z * f1 + o2) + amp * 0.04 * Math.sin(y * f2 + x * f2 + o2);
    p.setXYZ(i, x * d, y * d, z * d);
  }
  g.computeVertexNormals(); return g;
}
// soft fake AO: darker underneath, lighter on top
function shadeY(base, dark, light) { return function (l, w, n) { var k = n.y * 0.5 + 0.5; return k < 0.5 ? mixC(dark, base, k * 2) : mixC(base, light, (k - 0.5) * 2); }; }

/* ---------- renderer / scene ---------- */
var renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

var scene = new T.Scene();
(function sky() {
  var c = document.createElement('canvas'); c.width = 4; c.height = 256; var x = c.getContext('2d');
  var gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#A9D6E8'); gr.addColorStop(0.55, '#D9ECEC'); gr.addColorStop(0.8, '#F8EBD9'); gr.addColorStop(1, '#F6E2CC');
  x.fillStyle = gr; x.fillRect(0, 0, 4, 256);
  var tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; scene.background = tx;
})();
scene.fog = new T.Fog(0xF3E6D6, 34, 110);

// soft environment for gentle reflections (built once, from a gradient dome)
(function env() {
  var es = new T.Scene(), g = new T.SphereGeometry(50, 32, 16), p = g.attributes.position, c = [];
  var top = lin('#B8DDF0'), hor = lin('#FFF1E0'), bot = lin('#B5D29C');
  for (var i = 0; i < p.count; i++) { var y = p.getY(i) / 50, col = y > 0 ? mixC(hor, top, Math.pow(y, 0.6)) : mixC(hor, bot, Math.pow(-y, 0.5)); c.push(col.r, col.g, col.b); }
  g.setAttribute('color', new T.Float32BufferAttribute(c, 3));
  es.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
  var sunBlob = new T.Mesh(new T.SphereGeometry(5, 16, 8), new T.MeshBasicMaterial({ color: lin('#FFF4DE').multiplyScalar(3) }));
  sunBlob.position.set(30, 32, -6); es.add(sunBlob);
  var pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(es, 0.02).texture; pm.dispose();
})();

var camera = new T.PerspectiveCamera(42, 1, 0.1, 220);
var hemi = new T.HemisphereLight(0xFFF3E3, 0xA9C98F, 0.3); scene.add(hemi);
var sun = new T.DirectionalLight(0xFFE3C0, 0.78);
var TARGET = new T.Vector3(0.1, 0.75, 7.7);
sun.position.copy(TARGET).add(new T.Vector3(9, 13, -2));
sun.target.position.copy(TARGET); scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
var sc = sun.shadow.camera; sc.left = -11; sc.right = 11; sc.top = 11; sc.bottom = -11; sc.near = 2; sc.far = 45;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.025; sun.shadow.radius = 3;
scene.add(sun);

function SM(hex, o) { return new T.MeshStandardMaterial(Object.assign({ color: lin(hex), roughness: 0.8, metalness: 0, envMapIntensity: 0.55 }, o || {})); }
var VC = function (o) { return new T.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.8, metalness: 0, envMapIntensity: 0.32 }, o || {})); };

/* ---------- world ---------- */
var R_LAKE = 8.1, GROUND_Y = 0.25, R_WALK = 9.35;
var WORLD = {};
(function buildWorld() {
  // ground: sand path ring -> grass, with gentle colour noise
  var gp = new Parts();
  var sandC = lin('#EBD9B2'), sandD = lin('#DCC59A'), grass = lin('#A9D190'), grassD = lin('#93C27A'), earth = lin('#CDB48C');
  var ring = new T.RingGeometry(8.25, 75, 160, 24);
  ring.rotateX(-Math.PI / 2); ring.translate(0, GROUND_Y, 0);
  gp.add(ring, function (l, w) {
    var r = Math.hypot(w.x, w.z), nz = 0.5 + 0.5 * Math.sin(w.x * 0.9 + Math.sin(w.z * 0.7) * 2) * Math.sin(w.z * 1.1);
    var base = mixC(grass, grassD, nz * 0.6);
    if (r < 8.7) return mixC(earth, sandC, sstep(8.25, 8.7, r));
    if (r < 10.6) return mixC(mixC(sandC, sandD, nz * 0.4), base, sstep(9.9, 10.6, r));
    return mixC(base, lin('#B9D7A0'), sstep(30, 60, r));
  });
  var ground = gp.mesh(VC({ roughness: 0.95, envMapIntensity: 0.25 }), false, true); scene.add(ground);

  // bank slope + lake bed (seen through the water)
  var bp = new Parts();
  var bedPts = [];
  for (var i = 0; i <= 24; i++) { var r = i / 24 * 8.25, y = r < 7.3 ? -1.25 + 0.5 * Math.pow(r / 7.3, 2) : lerp(-0.75, GROUND_Y + 0.001, sstep(7.3, 8.25, r)); bedPts.push([Math.max(r, 1e-3), y]); }
  var bed = lathe(bedPts, 96);
  var deep = lin('#2F7880'), shallow = lin('#76B3A3'), bankC = lin('#C9B288');
  bp.add(bed, function (l, w) { var r = Math.hypot(w.x, w.z); return r > 7.6 ? mixC(shallow, bankC, sstep(7.6, 8.2, r)) : mixC(deep, shallow, sstep(3, 7.6, r)); });
  scene.add(bp.mesh(VC({ roughness: 1, envMapIntensity: 0.2, side: T.DoubleSide }), false, false));

  // water: animated vertices, transparent
  var wg = new T.RingGeometry(0.001, R_LAKE + 0.05, 128, 14);
  var wc = [], wp = wg.attributes.position, wDeep = lin('#4AA3AC'), wEdge = lin('#8ED0C8');
  for (i = 0; i < wp.count; i++) { var rr = Math.hypot(wp.getX(i), wp.getY(i)); var cc = mixC(wDeep, wEdge, sstep(4, 8, rr)); wc.push(cc.r, cc.g, cc.b); }
  wg.setAttribute('color', new T.Float32BufferAttribute(wc, 3));
  var water = new T.Mesh(wg, new T.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.46, roughness: 0.07, metalness: 0.05, envMapIntensity: 0.9, depthWrite: false }));
  water.rotation.x = -Math.PI / 2; water.position.y = 0; water.renderOrder = 10; scene.add(water);
  WORLD.water = water; WORLD.waterBase = Float32Array.from(wp.array);

  var foam = new T.Mesh(new T.RingGeometry(7.72, 8.12, 128, 1), new T.MeshBasicMaterial({ color: lin('#FFFFFF'), transparent: true, opacity: 0.32, depthWrite: false }));
  foam.rotation.x = -Math.PI / 2; foam.position.y = 0.02; foam.renderOrder = 11; scene.add(foam); WORLD.foam = foam;

  // rounded stones along the bank + a few big rocks
  var sp = new Parts();
  var stoneCols = ['#C4BAA9', '#B3A998', '#CCC2B1', '#ADA497'].map(lin), moss = lin('#9CBF84');
  for (i = 0; i < 78; i++) {
    var a = i / 78 * Math.PI * 2 + (rand() - 0.5) * 0.05, rr2 = 8.05 + rand() * 0.35, s = 0.16 + rand() * 0.2;
    var base = stoneCols[i % 4];
    sp.add(rockGeo(i + 3, 14, 10, 0.45), shadeY(base, mixC(base, lin('#8E8577'), 0.45), mixC(base, lin('#FFFFFF'), 0.25)),
      MX([Math.cos(a) * rr2, 0.06 + rand() * 0.06, Math.sin(a) * rr2], [0, rand() * 6, 0], [s * (1 + rand() * 0.5), s * 0.62, s]));
  }
  var bigRocks = [[2.6, 9.6, 0.55], [-5.6, 7.9, 0.5], [6.4, 6.6, 0.7], [-7.9, -5.0, 0.8], [3, -9.3, 0.6], [8.9, -3, 0.5], [-2.2, 10.3, 0.32], [5.1, 8.5, 0.4]];
  bigRocks.forEach(function (b, k) {
    var base = stoneCols[k % 4];
    sp.add(rockGeo(100 + k, 28, 18), function (l, w, n) { var c0 = shadeY(base, mixC(base, lin('#857C6F'), 0.5), mixC(base, lin('#FFFFFF'), 0.2))(l, w, n); return n.y > 0.55 ? mixC(c0, moss, sstep(0.55, 0.9, n.y) * 0.55) : c0; },
      MX([b[0], GROUND_Y + b[2] * 0.25, b[1]], [0, k, 0], [b[2] * 1.3, b[2] * 0.8, b[2]]));
  });
  scene.add(sp.mesh(VC({ roughness: 0.9 }), true, true));

  // trees: smooth round canopies, baked soft AO
  var trunks = new Parts(), leaves = new Parts();
  var bark = lin('#8B7158'), barkD = lin('#6E5A48');
  var greens = ['#8CC08A', '#7FB57E', '#98C890', '#86BA7C'].map(lin);
  function canopyCol(base) { var dark = mixC(base, lin('#4E7F5A'), 0.55), light = mixC(base, lin('#E8F5C8'), 0.35); return shadeY(base, dark, light); }
  function tree(x, z, s, seed) {
    var r = rng(seed);
    var tg = lathe([[0.2, 0], [0.16, 0.4], [0.13, 1.4], [0.1, 2.2], [0.001, 2.25]], 14);
    trunks.add(tg, shadeY(bark, barkD, bark), MX([x, GROUND_Y, z], [0, 0, 0], s));
    var base = greens[seed % 4], n = 5;
    for (var j = 0; j < n; j++) {
      var a = j / n * Math.PI * 2 + r(), d = j === 0 ? 0 : 0.55 + r() * 0.25, rr = j === 0 ? 1.05 : 0.7 + r() * 0.2;
      leaves.add(new T.SphereGeometry(1, 18, 12), canopyCol(base), MX([x + Math.cos(a) * d * s, GROUND_Y + (2.3 + (j === 0 ? 0.55 : r() * 0.5)) * s, z + Math.sin(a) * d * s], [0, 0, 0], [rr * s, rr * 0.9 * s, rr * s]));
    }
  }
  [[200, 14, 1.2], [235, 13, 1.0], [160, 16.5, 1.35], [300, 13.2, 1.1], [330, 15, 1.25], [20, 13.5, 1.0], [45, 16, 1.3], [80, 18, 1.2], [270, 17, 1.4], [175, 22, 1.5], [100, 21, 1.3]].forEach(function (t, k) {
    var a = t[0] * Math.PI / 180; tree(Math.cos(a) * t[1], Math.sin(a) * t[1], t[2], k + 11);
  });
  // round shrubs near the path
  [[140, 10.9, 0.55], [62, 11, 0.5], [97, 11.2, 0.42], [215, 10.8, 0.5], [350, 10.9, 0.55], [285, 10.7, 0.45]].forEach(function (b, k) {
    var a = b[0] * Math.PI / 180, x = Math.cos(a) * b[1], z = Math.sin(a) * b[1], base = greens[(k + 1) % 4];
    for (var j = 0; j < 3; j++) leaves.add(new T.SphereGeometry(1, 16, 10), canopyCol(base), MX([x + (j - 1) * b[2] * 0.7, GROUND_Y + b[2] * 0.55, z + (j % 2) * b[2] * 0.4], [0, 0, 0], [b[2], b[2] * 0.85, b[2]]));
    for (j = 0; j < 4; j++) leaves.add(new T.SphereGeometry(0.07, 8, 6), lin(k % 2 ? '#F6B9CB' : '#FFF4E8'), MX([x + (rand() - 0.5) * b[2] * 1.6, GROUND_Y + b[2] * (0.9 + rand() * 0.4), z + (rand() - 0.5) * b[2]]));
  });

  // bodhi / banyan tree: buttressed trunk, broad canopy, aerial roots
  (function bodhi() {
    var a = 128 * Math.PI / 180, x = Math.cos(a) * 13.2, z = Math.sin(a) * 13.2;
    var tg = folds(lathe([[1.15, 0], [0.75, 0.35], [0.58, 1.0], [0.52, 2.2], [0.56, 3.0], [0.3, 3.5], [0.001, 3.6]], 36), 9, function (y) { return 0.14 * (1 - sstep(0, 3.2, y)) + 0.05; });
    trunks.add(tg, shadeY(bark, barkD, mixC(bark, lin('#FFFFFF'), 0.12)), MX([x, GROUND_Y, z]));
    for (var k = 0; k < 6; k++) { // big limbs
      var ang = k / 6 * Math.PI * 2 + 0.3;
      var m = new T.Matrix4().makeTranslation(x, GROUND_Y + 3.0, z).multiply(new T.Matrix4().makeRotationY(ang)).multiply(new T.Matrix4().makeRotationZ(-0.95)).multiply(new T.Matrix4().makeTranslation(0, 0.9, 0));
      trunks.add(capsule(0.17, 1.8, 10, 4), bark, m);
    }
    for (k = 0; k < 7; k++) { // surface roots
      var ra = k / 7 * Math.PI * 2 + 0.2;
      var m2 = new T.Matrix4().makeTranslation(x + Math.cos(ra) * 1.0, GROUND_Y + 0.05, z + Math.sin(ra) * 1.0).multiply(new T.Matrix4().makeRotationY(-ra)).multiply(new T.Matrix4().makeRotationZ(Math.PI / 2 - 0.12));
      trunks.add(capsule(0.12, 1.0, 8, 4), barkD, m2);
    }
    for (k = 0; k < 10; k++) { // aerial roots
      var aa = rand() * Math.PI * 2, d = 1.6 + rand() * 1.8, len = 1.6 + rand() * 1.3;
      trunks.add(capsule(0.035, len, 6, 3), mixC(bark, lin('#BBA58A'), 0.4), MX([x + Math.cos(aa) * d, GROUND_Y + 4.2 - len / 2, z + Math.sin(aa) * d]));
    }
    var base = lin('#7DB27A');
    var blobs = [[0, 5.6, 0, 2.0]];
    for (k = 0; k < 9; k++) { var ba = k / 9 * Math.PI * 2; blobs.push([Math.cos(ba) * 2.7, 4.6 + rand() * 0.7, Math.sin(ba) * 2.4, 1.35 + rand() * 0.4]); }
    for (k = 0; k < 5; k++) { var bb = k / 5 * Math.PI * 2 + 0.6; blobs.push([Math.cos(bb) * 1.4, 6.0 + rand() * 0.5, Math.sin(bb) * 1.3, 1.25 + rand() * 0.3]); }
    blobs.forEach(function (b, j) { leaves.add(new T.SphereGeometry(1, 22, 14), canopyCol(mixC(base, greens[j % 4], 0.4)), MX([x + b[0], GROUND_Y + b[1], z + b[2]], [0, 0, 0], [b[3], b[3] * 0.82, b[3]])); });
    WORLD.bodhiPos = new T.Vector3(x, 0, z);
  })();
  scene.add(trunks.mesh(VC({ roughness: 0.9 }), true, true));
  scene.add(leaves.mesh(VC({ roughness: 0.85, envMapIntensity: 0.4 }), true, true));

  // grass tufts and small flowers
  var gr = new Parts(), tuftC = lin('#86BD72');
  for (i = 0; i < 170; i++) {
    var ga = rand() * Math.PI * 2, gR = 10.3 + Math.pow(rand(), 1.5) * 9, gx = Math.cos(ga) * gR, gz = Math.sin(ga) * gR;
    for (var b2 = 0; b2 < 3; b2++) gr.add(new T.ConeGeometry(0.04, 0.32, 5), shadeY(tuftC, mixC(tuftC, lin('#4F7F4A'), 0.4), mixC(tuftC, lin('#E7F4C2'), 0.3)), MX([gx + (b2 - 1) * 0.05, GROUND_Y + 0.14, gz], [(b2 - 1) * 0.3, 0, (b2 - 1) * 0.35]));
    if (i % 3 === 0) gr.add(new T.SphereGeometry(0.05, 8, 6), lin(['#FFFFFF', '#FFE08A', '#F7B8CC'][i % 3]), MX([gx + 0.12, GROUND_Y + 0.12, gz + 0.06]));
  }
  scene.add(gr.mesh(VC({ roughness: 0.9 }), false, true));

var hero = makeFish('red', 0.9);

/* ---------- splash fx ---------- */
var ringGeo = new T.RingGeometry(0.86, 1, 56);

for (var ri = 0; ri < 5; ri++) {

// precompute release point

var REL_P = handMid(new T.Vector3()).add(new T.Vector3(0, 0.02, -0.05));

(function () { var tmp = new T.Vector3(); ringEvents.push([5.4, SPLASH.clone(), 1.5, 1.2]); ringEvents.push([5.58, SPLASH.clone(), 1.0, 1.1]);
